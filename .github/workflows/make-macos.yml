# make-macos.yml —— Group M·GNU make macOS 2 组合（F-09-03；gmake 约定）
name: make-macos

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      toolset: { description: 'clang', default: 'clang' }
      variant: { description: 'arm64（空=全量）', default: '' }
      cfg: { description: 'Debug|Release（空=全量）', default: '' }
      kind: { description: 'static|shared（空=全量）', default: '' }

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: arm64, cfg: Debug, kind: static }
          - { variant: arm64, cfg: Debug, kind: shared }
          - { variant: arm64, cfg: Release, kind: static }
          - { variant: arm64, cfg: Release, kind: shared }
    uses: ./.github/workflows/_combo.yml
    with:
      os: macos
      toolset: clang
      variant: ${{ matrix.variant }}
      cfg: ${{ matrix.cfg }}
      kind: ${{ matrix.kind }}
      filter_variant: ${{ inputs.variant }}
      filter_cfg: ${{ inputs.cfg }}
      filter_kind: ${{ inputs.kind }}
      group: make/gnu
