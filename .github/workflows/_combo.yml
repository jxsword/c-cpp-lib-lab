# _combo.yml —— reusable：单组合「构建 → RV → SA → 结论 → artifact」（F-09-01；S5/S8）
# 五个 step 顺序：build → run(RV) → analyze(SA) → summary → artifact。
# RV 与 SA 为不同 step、不同脚本、不同报告目录（P5/C18 隔离，A4）。
# Debug 产物不作为发布 artifact 上传（A5：仅 Release 上传，且名标 reports-）。
# 亦支持 workflow_dispatch 单独演练（卡面命令：同组合连跑两次验证 cache-hit）。
name: _combo

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      toolset:
        required: true
        type: string
      variant:
        required: true
        type: string
      cfg:
        required: true
        type: string
      kind:
        required: true
        type: string
      filter_variant:
        description: 'dispatch 过滤：空=全量；非空则仅 variant 匹配的 job 实跑'
        required: false
        type: string
        default: ''
      filter_cfg:
        required: false
        type: string
        default: ''
      filter_kind:
        required: false
        type: string
        default: ''
      group:
        required: true
        type: string # native | make/gnu | make/nmake | make/msbuild | cmake
    outputs:
      sa-pass:
        description: 'SA-1..SA-10 all PASS'
        value: ${{ jobs.combo.outputs.sa_pass }}

jobs:
  env:
    uses: ./.github/workflows/_env.yml
    with:
      os: ${{ inputs.os }}
      toolset: ${{ inputs.toolset }}
      variant: ${{ inputs.variant }}
      cfg: ${{ inputs.cfg }}
      kind: ${{ inputs.kind }}

  combo:
    needs: env
    runs-on: ${{ inputs.os == 'linux' && 'ubuntu-latest' || inputs.os == 'macos' && 'macos-15' || 'windows-latest' }}
    env:
      FILTER_MATCH: ${{ (inputs.filter_variant == '' || inputs.filter_variant == inputs.variant) && (inputs.filter_cfg == '' || inputs.filter_cfg == inputs.cfg) && (inputs.filter_kind == '' || inputs.filter_kind == inputs.kind) }}
    outputs:
      sa_pass: ${{ steps.analyze.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      # env 与 combo 是不同 runner：本 runner 重新恢复缓存并安装包
      # （apt 缓存命中 env job 的 save → 安装近零；A3 的 cache-hit 证据链在此）
      - name: Restore env (cache + packages on this runner)
        id: setup
        uses: ./.github/actions/setup-env
        with:
          toolset: ${{ inputs.toolset }}
          variant: ${{ inputs.variant }}
          cfg: ${{ inputs.cfg }}
          kind: ${{ inputs.kind }}

      # ---- step 1: build（构建，按 group/OS 分派脚本） ----
      - name: Setup MSVC environment (vcvars)
        # msbuild 方言也需要 vcvars（msbuild/dumpbin/cl 均由 vcvarsall 置入 PATH）
        if: runner.os == 'Windows' && (inputs.toolset == 'msvc' || inputs.toolset == 'clang-cl' || inputs.toolset == 'msbuild')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ startsWith(inputs.variant, 'x64') && 'x64' || 'x86' }}

      - name: Build combo
        id: build
        shell: bash
        run: |
          set -e
          OSPREFIX="${{ inputs.os }}"; [ "$OSPREFIX" = windows ] && OSPREFIX=win
          TAG="${OSPREFIX}_${{ inputs.toolset }}_${{ inputs.variant }}_${{ inputs.cfg }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "${{ inputs.group }}" in
            native)
              case "${{ inputs.os }}" in
                linux) ./scripts/linux/native.sh "${{ inputs.variant }}" "${{ inputs.cfg }}" "${{ inputs.kind }}" ;;
                macos) ./scripts/macos/native.sh "${{ inputs.variant }}" "${{ inputs.cfg }}" "${{ inputs.kind }}" ;;
                windows) pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows/native.ps1 -Toolset "${{ inputs.toolset }}" -Variant "${{ inputs.variant }}" -Cfg "${{ inputs.cfg }}" -Kind "${{ inputs.kind }}" ;;
              esac ;;
            cmake)
              case "${{ inputs.os }}" in
                linux) ./scripts/linux/cmake.sh "${{ inputs.variant }}" "${{ inputs.cfg }}" "${{ inputs.kind }}" ;;
                macos) ./scripts/macos/cmake.sh "${{ inputs.variant }}" "${{ inputs.cfg }}" "${{ inputs.kind }}" ;;
                windows)
                  # msvc/clang-cl 强制 Ninja（S9）；msys2 走 MinGW Makefiles
                  RTL=""
                  case "${{ inputs.variant }}" in
                    *_MD) RTL=MultiThreadedDLL ;;
                    *_MT) RTL=MultiThreaded ;;
                  esac
                  RTARGS=""
                  [ -n "$RTL" ] && RTARGS="-DCMAKE_MSVC_RUNTIME_LIBRARY=$RTL"
                  pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows/cmake.ps1 -Toolset "${{ inputs.toolset }}" -Variant "${{ inputs.variant }}" -Cfg "${{ inputs.cfg }}" -Kind "${{ inputs.kind }}" $RTARGS
                  ;;
              esac ;;
            make/gnu)
              # GNU make 方言：linux/macos 用 PATH 上的 make；
              # msys2 用 MSYS make（usr/bin/make.exe，recipes 需 sh：mkdir -p / rm -f；
              # 各环境 mingw-w64-<env>-make 只提供 mingw32-make.exe，不作此用）
              SRCDIR="$(pwd)"
              OSPREFIX="${{ inputs.os }}"; [ "$OSPREFIX" = windows ] && OSPREFIX=win
              TAG="${OSPREFIX}_${{ inputs.toolset }}_${{ inputs.variant }}_${{ inputs.cfg }}"
              [ "${{ inputs.os }}" = windows ] && TAG="win_msys2_${{ inputs.variant }}_${{ inputs.cfg }}"
              B="build/make/gnu/$TAG/${{ inputs.kind }}"
              mkdir -p "$B" && cd "$B"
              if [ "${{ inputs.os }}" = windows ]; then
                # C8：目录名小写（mingw64/mingw32/clang64/ucrt64）；CLANG64 编译器是 clang
                MSYSROOT="$(cygpath -u "$RUNNER_TEMP/msys64" 2>/dev/null || echo /d/a/_temp/msys64)"
                MAKEBIN="$MSYSROOT/usr/bin/make.exe"
                [ -f "$MAKEBIN" ] || { echo "FAIL: msys2 make not found: $MAKEBIN"; exit 1; }
                case "${{ inputs.variant }}" in
                  MINGW64) MDIR=mingw64;  MCC=gcc.exe;   MTOOLSET=gcc ;;
                  MINGW32) MDIR=mingw32;  MCC=gcc.exe;   MTOOLSET=gcc ;;
                  CLANG64) MDIR=clang64;  MCC=clang.exe; MTOOLSET=clang ;;
                  UCRT64)  MDIR=ucrt64;   MCC=gcc.exe;   MTOOLSET=gcc ;;
                esac
                CCBIN="$(cygpath -m "$MSYSROOT/$MDIR/bin/$MCC")"
                [ -f "$MSYSROOT/$MDIR/bin/$MCC" ] || { echo "FAIL: msys2 compiler not found: $CCBIN"; exit 1; }
                # 环境工具链 bin 前置 PATH（C8 + DLL 依赖解析）：镜像 PATH 预装 C:\mingw64\bin
                #（64 位 DLL），MINGW32 的 cc1.exe（32 位）沿 PATH 解析到 64 位 zlib1.dll 等
                # 即静默死亡（gcc -v 取证：cc1 被调起后零输出退 1，两条 spawn 通道同现）
                PATH="$MSYSROOT/$MDIR/bin:$PATH"
                export PATH
                # 编译器探针：工具链可运行性显式留痕（缺 DLL / 架构不匹配类故障在此显式暴露）
                "$CCBIN" --version || { echo "FAIL: compiler probe rc=$? : $CCBIN --version"; exit 1; }
                ARBIN="$(cygpath -m "$MSYSROOT/$MDIR/bin/ar.exe")"
                "$MAKEBIN" -f "$SRCDIR/Makefile" srcdir="$SRCDIR" OS=msys2 TOOLSET="$MTOOLSET" VARIANT="${{ inputs.variant }}" CFG="${{ inputs.cfg }}" KIND="${{ inputs.kind }}" CC="$CCBIN" AR="$ARBIN" selftest
              else
                make -f "$SRCDIR/Makefile" srcdir="$SRCDIR" VARIANT="${{ inputs.variant }}" CFG="${{ inputs.cfg }}" KIND="${{ inputs.kind }}" selftest
              fi
              ;;
            make/nmake)
              # clang-cl 2 组合（F-05-02：msvc 8 + clang-cl 2）传 -CC clang-cl
              CCARGS=""
              [ "${{ inputs.toolset }}" = "clang-cl" ] && CCARGS="-CC clang-cl"
              pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows/nmake.ps1 -Variant "${{ inputs.variant }}" -Cfg "${{ inputs.cfg }}" -Kind "${{ inputs.kind }}" $CCARGS
              ;;
            make/msbuild)
              pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows/msbuild.ps1 -Variant "${{ inputs.variant }}" -Cfg "${{ inputs.cfg }}" -Kind "${{ inputs.kind }}"
              ;;
            *)
              echo "SKIP: unknown group"
              exit 0
              ;;
          esac

      # ---- step 2: RV 运行输出采集（独立 step / 独立脚本 / reports/<tag>/run/） ----
      - name: RV run output capture
        id: rv
        if: always() && env.FILTER_MATCH == 'true' && steps.build.outcome == 'success'
        shell: bash
        run: |
          OSPREFIX="${{ inputs.os }}"; [ "$OSPREFIX" = windows ] && OSPREFIX=win
          TAG="${OSPREFIX}_${{ inputs.toolset }}_${{ inputs.variant }}_${{ inputs.cfg }}"
          # nmake 方言独立标签（nmake.ps1 按 win_nmake_* 落盘，与 F-09-05 汇总行一致）
          [ "${{ inputs.group }}" = "make/nmake" ] && TAG="win_nmake_${{ inputs.variant }}_${{ inputs.cfg }}"
          case "${{ inputs.os }}" in
            linux) ./scripts/linux/run.sh "$TAG" "${{ inputs.kind }}" "${{ inputs.group }}" ;;
            macos) ./scripts/macos/run.sh "$TAG" "${{ inputs.kind }}" "${{ inputs.group }}" ;;
            windows) pwsh -File scripts/windows/run.ps1 -Tag "$TAG" -Kind "${{ inputs.kind }}" -Group "${{ inputs.group }}" ;;
          esac

      # ---- step 3: SA 三层静态分析（独立 step / 独立脚本 / reports/<tag>/<group>/） ----
      - name: SA static analysis
        id: analyze
        if: always() && env.FILTER_MATCH == 'true' && steps.build.outcome == 'success'
        shell: bash
        run: |
          OSPREFIX="${{ inputs.os }}"; [ "$OSPREFIX" = windows ] && OSPREFIX=win
          TAG="${OSPREFIX}_${{ inputs.toolset }}_${{ inputs.variant }}_${{ inputs.cfg }}"
          # nmake 方言独立标签（与 RV 步同口径）
          [ "${{ inputs.group }}" = "make/nmake" ] && TAG="win_nmake_${{ inputs.variant }}_${{ inputs.cfg }}"
          case "${{ inputs.os }}" in
            linux) ./scripts/linux/analyze.sh "$TAG" "${{ inputs.kind }}" "${{ inputs.group }}" ;;
            macos) ./scripts/macos/analyze.sh "$TAG" "${{ inputs.kind }}" "${{ inputs.group }}" ;;
            windows) pwsh -File scripts/windows/static_analyze.ps1 -Tag "$TAG" -Kind "${{ inputs.kind }}" -Group "${{ inputs.group }}" ;;
          esac

      # ---- step 4: 5.8.4 禁令扫描（A6：CI 中执行且零命中） ----
      - name: Scan dynamic-call bans
        if: always()
        shell: bash
        run: ./scripts/tools/scan_dynamic_calls.sh

      # ---- step 5: 结论表 + artifact（A5：仅 Release 上传发布报告） ----
      - name: Summary to job summary
        if: always() && env.FILTER_MATCH == 'true'
        shell: bash
        run: |
          {
            echo '### Combo ${{ inputs.os }}_${{ inputs.toolset }}_${{ inputs.variant }}_${{ inputs.cfg }} / ${{ inputs.kind }}'
            echo '- cache-hit: ${{ needs.env.outputs.cache-hit }}'
            echo '- build: ${{ steps.build.outcome }} / rv: ${{ steps.rv.outcome }} / sa: ${{ steps.analyze.outcome }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports artifact
        if: always() && env.FILTER_MATCH == 'true' && inputs.cfg == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ inputs.os }}_${{ inputs.toolset }}_${{ inputs.variant }}_${{ inputs.cfg }}_${{ inputs.kind }}
          path: |
            reports/**/native/*.md
            reports/**/native/*.txt
            reports/**/run/*.txt
            reports/**/deps/*.json
          if-no-files-found: ignore
