# tests/assertions/F-02-03.yml — F-02-03 断言基线（F-02-05 起为 verify_card.sh 机器可执行格式）
# 原始逐条断言输出见该卡回执（PR #32）。A7 以「引擎可再生三层输出」表达
# （layer1/2 为运行时证据，自 PR #33 起不入库，由 analyze.sh 现场生成）。
card: F-02-03
checks:
  - id: A6-scan-clean
    action: run
    args: ./scripts/tools/scan_dynamic_calls.sh
    expect: exit0
  - id: A7-engine-regenerates-three-layers
    action: run
    args: ./scripts/linux/analyze.sh linux_gcc_x64_Release shared native
    expect: exit0
  - id: A7-layer1-dumps-regenerated
    action: exists
    args: reports/linux_gcc_x64_Release/native/layer1/readelf_h.txt
    expect: exit0
  - id: A7-layer2-dumps-regenerated
    action: exists
    args: reports/linux_gcc_x64_Release/native/layer2/lddtree.txt
    expect: exit0
  - id: A3-symlink-chain
    action: script
    args: ./scripts/tools/assert_tree.sh grepeq libvmath.so.1.0.0 reports/linux_gcc_x64_Release/deps/linux_gcc_x64_Release_shared.json
    expect: exit0
  - id: A4-deps-json-valid
    action: run
    args: python3 -m json.tool reports/linux_gcc_x64_Release/deps/linux_gcc_x64_Release_shared.json
    expect: exit0
